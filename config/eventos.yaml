# Tipos de evento de un lote de café y sus campos.
#
# BORRADOR v1 (2026-11-12): armado a partir de docs/especificacion.md, D-010 y los
# audios de prueba. Debe revisarlo alguien que conozca el trabajo en finca.
#
# De aquí salen, sin tocar código:
#   - los modelos Pydantic de la extracción (app/extraction/schema.py),
#   - el catálogo de eventos que se le explica a Claude (app/extraction/prompts.py),
#   - qué se le pregunta al productor cuando falta un dato ("obligatorio: true").
#
# Estructura:
#   tipos:
#     <clave>:                    # minúsculas, sin tildes ni espacios (va a la base)
#       nombre: texto para el productor ("Abonada")
#       descripcion: qué cuenta como este evento (lo lee Claude)
#       requiere_lote: si el evento siempre es de un lote (por defecto true)
#       publico: si sale en la página pública del lote, la que ve un comprador
#                (por defecto true). false para lo que es solo de la finca.
#       campos:
#         <campo>:
#           tipo: numero | texto
#           etiqueta: cómo se llama el dato en el panel ("Horas de fermentación")
#           obligatorio: true | false   (por defecto false)
#           unidades: [..]              (solo numero; claves de "unidades" abajo)
#           descripcion: qué es y cómo lo dice el productor
#           pregunta: lo que se le pregunta al productor si falta (obligatorios)
#           grafica: true si es una medición que el panel dibuja en el tiempo
#                    (solo numero; por defecto false)
#           publico: false si el dato no debe salir en la página pública del
#                    lote (costos, trabajadores...). Por defecto true. El texto
#                    original del caficultor nunca sale en la página pública.
#
# Un mismo nombre de campo puede estar en varios tipos, pero con el mismo "tipo".
# La fecha y el lote son comunes a todos los eventos y no se declaran aquí.

unidades:
  bulto: bulto (50 kg)
  kg: kilogramos
  g: gramos
  arroba: arroba (12,5 kg)
  carga: carga (125 kg)
  litro: litros
  cc: centímetros cúbicos
  caneca: canecas (tanques de fumigar)
  jornal: jornales
  persona: personas
  hora: horas
  dia: días
  porcentaje: porcentaje
  grado_celsius: grados centígrados (°C)
  g_por_planta: gramos por planta
  kg_por_surco: kilos por surco
  bulto_por_surco: bultos por surco
  cc_por_caneca: cc por caneca
  litro_por_caneca: litros por caneca
  g_por_caneca: gramos por caneca
  peso_por_kg: pesos por kilo
  peso_por_arroba: pesos por arroba
  peso_por_carga: pesos por carga
  peso: pesos (total)

tipos:
  abonada:
    nombre: Abonada
    descripcion: >-
      Aplicación de abono, fertilizante o enmienda al suelo (17-6-18, DAP, urea,
      cal dolomita, gallinaza). "Encalar" y "echar cal" también son abonada.
    campos:
      insumo:
        tipo: texto
        etiqueta: Abono
        obligatorio: true
        descripcion: Nombre o fórmula del abono tal como lo dijo (p. ej. "17-6-18", "cal dolomita").
        pregunta: ¿Qué abono echaste? Por ejemplo, 17-6-18, DAP o urea.
      cantidad:
        tipo: numero
        etiqueta: Cantidad
        obligatorio: true
        unidades: [bulto, kg, g, arroba]
        descripcion: Cantidad total aplicada en el lote.
        pregunta: ¿Cuánto abono echaste en total? Por ejemplo, 4 bultos.
      dosis:
        tipo: numero
        etiqueta: Dosis
        unidades: [g_por_planta, kg_por_surco, bulto_por_surco]
        descripcion: Cantidad por planta o por surco, si la dijo así.
      jornales:
        tipo: numero
        etiqueta: Jornales
        unidades: [jornal, persona]
        descripcion: Jornales o trabajadores que hicieron la labor.
        publico: false

  fumigacion:
    nombre: Fumigación
    descripcion: >-
      Aplicación de insecticida, fungicida o herbicida con bomba o caneca. Una
      fumigación para matar maleza también va aquí (no en desyerba).
    campos:
      producto:
        tipo: texto
        etiqueta: Producto
        obligatorio: true
        descripcion: Nombre comercial o ingrediente del producto aplicado.
        pregunta: ¿Qué producto aplicaste?
      objetivo:
        tipo: texto
        etiqueta: Para qué
        descripcion: Plaga, enfermedad o maleza que se quería controlar (broca, roya...).
      dosis:
        tipo: numero
        etiqueta: Dosis
        unidades: [cc_por_caneca, litro_por_caneca, g_por_caneca]
        descripcion: Cuánto producto por caneca.
      volumen:
        tipo: numero
        etiqueta: Mezcla aplicada
        unidades: [caneca, litro]
        descripcion: Cuántas canecas o litros de mezcla se aplicaron en total.
      dias_carencia:
        tipo: numero
        etiqueta: Días de carencia
        unidades: [dia]
        descripcion: Días de carencia del producto, solo si los dijo.
      jornales:
        tipo: numero
        etiqueta: Jornales
        unidades: [jornal, persona]
        descripcion: Jornales o trabajadores que hicieron la labor.
        publico: false

  desyerba:
    nombre: Desyerba
    descripcion: >-
      Control manual o mecánico de maleza: desyerba, plateo, guadañada, machete.
      Si en el mismo mensaje se dicen varias de estas labores para el mismo lote y
      el mismo día, es UN solo evento de desyerba.
    campos:
      metodo:
        tipo: texto
        etiqueta: Cómo se hizo
        descripcion: Cómo se hizo (guadaña, machete, plateo a mano...).
      jornales:
        tipo: numero
        etiqueta: Jornales
        unidades: [jornal, persona]
        descripcion: Jornales o trabajadores que hicieron la labor.
        publico: false

  recoleccion:
    nombre: Recolección
    descripcion: Cosecha de café en cereza (graneo, traviesa, pase, repase).
    campos:
      cantidad_cereza:
        tipo: numero
        etiqueta: Café cereza
        obligatorio: true
        unidades: [kg, arroba]
        descripcion: Café cereza recogido.
        pregunta: ¿Cuánto café cereza recogieron? En kilos o arrobas.
      recolectores:
        tipo: numero
        etiqueta: Recolectores
        unidades: [persona]
        descripcion: Número de recolectores.
        publico: false
      pase:
        tipo: texto
        etiqueta: Pase
        descripcion: Tipo de pase si lo dijo (graneo, traviesa, repase).

  beneficio:
    nombre: Beneficio
    descripcion: >-
      Proceso del café después de recogerlo: despulpado, fermentación, lavado.
      Varias etapas dichas juntas para el mismo café son UN solo evento.
    campos:
      etapa:
        tipo: texto
        etiqueta: Etapa
        obligatorio: true
        descripcion: Etapa o etapas hechas (despulpado, fermentación, lavado).
        pregunta: ¿Qué le hiciste al café? Despulpado, fermentación o lavado.
      cantidad:
        tipo: numero
        etiqueta: Cantidad
        unidades: [kg, arroba]
        descripcion: Cantidad de café procesado.
      horas_fermentacion:
        tipo: numero
        etiqueta: Horas de fermentación
        unidades: [hora]
        descripcion: Horas de fermentación, si las dijo.
        grafica: true

  secado:
    nombre: Secado
    descripcion: Secado del café pergamino (marquesina, patio, silo, elva).
    campos:
      cantidad_seco:
        tipo: numero
        etiqueta: Café seco
        obligatorio: true
        unidades: [kg, arroba, carga]
        descripcion: Café pergamino seco que quedó.
        pregunta: ¿Cuánto café seco quedó? En kilos, arrobas o cargas.
      metodo:
        tipo: texto
        etiqueta: Cómo se hizo
        descripcion: Dónde o cómo se secó (marquesina, patio, silo).
      humedad:
        tipo: numero
        etiqueta: Humedad
        unidades: [porcentaje]
        descripcion: Humedad final del grano, si la midió.
        grafica: true

  venta:
    nombre: Venta
    descripcion: Venta de café a una cooperativa, comprador o trilladora.
    requiere_lote: false
    # Precios y compradores son del negocio de la finca, no de la historia del lote.
    publico: false
    campos:
      cantidad:
        tipo: numero
        etiqueta: Cantidad
        obligatorio: true
        unidades: [kg, arroba, carga]
        descripcion: Cantidad vendida.
        pregunta: ¿Cuánto café vendiste? En kilos, arrobas o cargas.
      tipo_cafe:
        tipo: texto
        etiqueta: Tipo de café
        descripcion: Qué café vendió (pergamino seco, cereza, pasilla).
      precio:
        tipo: numero
        etiqueta: Precio
        unidades: [peso_por_kg, peso_por_arroba, peso_por_carga, peso]
        descripcion: Precio, solo si lo dijo.
      comprador:
        tipo: texto
        etiqueta: Comprador
        descripcion: A quién le vendió (cooperativa, comprador...).

  monitoreo_sanitario:
    nombre: Revisión de plagas y enfermedades
    descripcion: >-
      El productor vio una plaga o enfermedad en el lote (roya, broca, mancha de
      hierro, gotera...). Es lo que observó, no lo que piensa hacer.
    campos:
      problema:
        tipo: texto
        etiqueta: Plaga o enfermedad
        obligatorio: true
        descripcion: Plaga o enfermedad observada.
        pregunta: ¿Qué plaga o enfermedad viste?
      afectacion:
        tipo: texto
        etiqueta: Afectación
        descripcion: Cuánto o dónde (p. ej. "varias matas en la parte de abajo").
      porcentaje:
        tipo: numero
        etiqueta: Porcentaje afectado
        unidades: [porcentaje]
        descripcion: Porcentaje de infestación, solo si lo midió.
        grafica: true

  # --- PROVISIONALES (2026-11-13) -------------------------------------------
  # Agregados para que funcionen las alertas provisionales de config/alertas.yaml.
  # Pendientes de revisar con Brayan: nombres, descripciones y si de verdad son
  # eventos aparte o datos de "beneficio" y "secado".

  volteo:
    nombre: Volteo
    descripcion: >-
      Voltear, revolver o mover el café mientras se fermenta (en el tanque o la
      caneca). No es lo mismo que mover el café en el secador.
    campos:
      temperatura:
        tipo: numero
        etiqueta: Temperatura
        unidades: [grado_celsius]
        descripcion: Temperatura de la masa, solo si la midió.
        grafica: true

  medicion_fermentacion:
    nombre: Medición de la fermentación
    descripcion: >-
      El productor midió cómo va la fermentación (temperatura de la masa). Si
      además volteó el café, es un volteo con temperatura, no este evento.
    campos:
      temperatura:
        tipo: numero
        etiqueta: Temperatura
        obligatorio: true
        unidades: [grado_celsius]
        descripcion: Temperatura de la masa en fermentación.
        grafica: true
        pregunta: ¿A cuántos grados estaba el café? Por ejemplo, 25 grados.

  medicion_humedad:
    nombre: Medición de humedad
    descripcion: >-
      El productor midió la humedad del café mientras se seca (con medidor o
      prueba). Si es la humedad final al terminar el secado, va en secado.
    campos:
      humedad:
        tipo: numero
        etiqueta: Humedad
        obligatorio: true
        unidades: [porcentaje]
        descripcion: Humedad del grano medida.
        grafica: true
        pregunta: ¿Cuánta humedad marcó el café? Por ejemplo, 11,5 por ciento.
