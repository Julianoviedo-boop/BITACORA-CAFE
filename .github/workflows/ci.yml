# Pruebas y build. Corre en cada pull request y lo reutiliza publicar.yml antes
# de subir imágenes. No usa ningún secreto: la API de Claude y WhatsApp quedan
# en modo de prueba (WHATSAPP_CHANNEL=fake, sin ANTHROPIC_API_KEY).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Pruebas del backend y respaldo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Valores solo para la CI (PostgreSQL desechable del runner).
      DATABASE_URL: postgresql+psycopg://bitacora:ci-solo-pruebas@localhost:5432/bitacora_cafe
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CONFIG_DIR: ${{ github.workspace }}/config
      WHATSAPP_CHANNEL: fake
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env de prueba
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-solo-pruebas/' .env

      - name: Levantar PostgreSQL y Redis (docker-compose.yml)
        run: docker compose up -d --wait db redis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Librerías del sistema para WeasyPrint (reporte PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python - <<'PY' > /tmp/requirements.txt
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          print("\n".join(d["project"]["dependencies"] + d["project"]["optional-dependencies"]["dev"]))
          PY
          pip install -r /tmp/requirements.txt

      - name: Pruebas
        working-directory: backend
        run: |
          # Sin WeasyPrint las pruebas del PDF se saltarían: aquí deben correr.
          python -c "import weasyprint"
          python -m pytest -q

      - name: Migrar y cargar datos de ejemplo
        working-directory: backend
        run: |
          alembic upgrade head
          python ../scripts/seed.py

      - name: Probar respaldo y restauración
        run: |
          export RESPALDO_DIR="$RUNNER_TEMP/respaldos"
          ARCHIVO="$(scripts/respaldo_db.sh --solo-local | tail -n1)"
          ESTRICTO=1 scripts/probar_restauracion.sh "$ARCHIVO"

      - name: Revisar scripts de shell
        run: shellcheck -x -S warning scripts/*.sh

  web:
    name: Build del panel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  imagenes:
    name: Build de imágenes (${{ matrix.nombre }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            contexto: backend
            etapa: api
          - nombre: web
            contexto: web
            etapa: prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin subir)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.etapa }}
          push: false
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Validar docker-compose.prod.yml
        if: matrix.nombre == 'backend'
        env:
          GHCR_OWNER: ejemplo
          IMAGE_TAG: sha-0000000
          API_DOMAIN: api.ejemplo.com
          WEB_DOMAIN: panel.ejemplo.com
          ACME_EMAIL: ci@ejemplo.com
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config --quiet
