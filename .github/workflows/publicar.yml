# En cada push a main: corre la CI completa y, si pasa, construye las imágenes y
# las sube a GitHub Container Registry (ghcr.io) con dos tags:
#   sha-<7 caracteres del commit>  → el que se despliega (permite volver atrás)
#   latest                          → lo último de main
# Usa el GITHUB_TOKEN del propio workflow: no hay secretos guardados en el repo.
name: Publicar imágenes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publicar:
    name: Publicar ${{ matrix.nombre }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nombre: backend
            contexto: backend
            etapa: api
          - nombre: web
            contexto: web
            etapa: prod
    steps:
      - uses: actions/checkout@v4

      - name: Dueño en minúsculas (GHCR lo exige)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/bitacora-cafe-${{ matrix.nombre }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.etapa }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Resumen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.nombre }}"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "En el servidor: \`scripts/desplegar.sh sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
